name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# vcpkg is pinned to the same baseline as vcpkg.json; the preset toolchain path
# is $HOME/vcpkg, so setup must place it there.
env:
  VCPKG_BASELINE: 319504a5326aa870edde46438c5455fa76305a56

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    # Pinned rather than ubuntu-latest: the baseline compiler and libraries are
    # part of the contract (see README), and ubuntu-latest migrates to Ubuntu 26
    # on 2026-10-19, which would silently change the toolchain underneath us.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v7

      - name: Set up vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_BASELINE"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-

      # Newer kernels randomise mmap more aggressively than TSan expects; this
      # is the documented workaround for the "unexpected memory mapping" abort.
      - name: Relax ASLR for ThreadSanitizer
        if: matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  oracle:
    name: linux / oracle
    # QuantLib is heavy (Boost + QuantLib). The vcpkg binary cache makes this
    # fast after the first successful run; it is test-only and never linked into
    # the engine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_BASELINE"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-oracle-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-oracle-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        run: cmake --preset oracle

      - name: Build
        run: cmake --build --preset oracle

      - name: Test
        run: ctest --preset oracle

  macos:
    name: macos / dev
    runs-on: macos-15  # pinned for a stable arm64 dev toolchain
    steps:
      - uses: actions/checkout@v7

      - name: Set up vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$VCPKG_BASELINE"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_BASELINE }}-

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev
